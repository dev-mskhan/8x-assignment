# Redis configuration for local development.
# Mounted into the redis container via docker-compose.yml.

# ---- Network ----------------------------------------------------------------
bind 0.0.0.0
protected-mode no
port 6379

# ---- Persistence (optional for local dev — comment out for pure cache) ------
# Append-only file for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ---- Memory -----------------------------------------------------------------
# Set a reasonable limit for local dev (adjust for production)
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# ---- Logging ----------------------------------------------------------------
loglevel notice

# ---- Pub/Sub ----------------------------------------------------------------
# No special configuration needed — default Pub/Sub works out of the box.
# Redis Pub/Sub is used for ephemeral WebSocket fan-out only (AGENTS.md §28).
