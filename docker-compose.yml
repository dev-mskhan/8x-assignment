version: "3.9"

# Local development infrastructure.
# Run: docker compose up -d
# Stop: docker compose down
# Reset: docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO — S3-compatible object storage for local development.
  # Production uses Cloudflare R2 (same S3 API, different endpoint + credentials).
  # Console UI: http://localhost:9001  (login: minioadmin / minioadmin)
  # API endpoint: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initializer — runs once, creates the marketplace bucket,
  # sets it to public read, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: marketplace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/marketplace;
        mc anonymous set download local/marketplace;
        echo 'MinIO bucket ready';
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
